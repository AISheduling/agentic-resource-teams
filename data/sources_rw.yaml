  - id: SRC.HIST_JOURNAL
    title: "Журнал производства каменных работ (ведомость по дням), СИНТЕТИЧЕСКИЙ: кладка перегородок 120 мм, 01.06–16.06.2026"
    author: "создан для НИР (вымышленная организация «Образец-Строй»)"
    year: 2026
    role: history_synthetic
    used_in: [PKG-04 (план), PKG-09 (план, пересобрать)]
    file: "07_history_synth_1_zhurnal.txt / d3b4ae30-hist_1_zhurnal.pdf"
    url: null
    format: "PDF, 3 стр.; разделы: общие сведения, состав звеньев (А — 4+2, Б — 3+2), таблица по дням (16 дней), сводка по звеньям"
    volume: "3 стр.; 2 звена; итого 260 чел.-ч, 253,0 м², кран 15,2 маш.-ч (в документе)"
    access: "собственный синтетический документ; файл в проекте"
    license: "вымышленные данные, юридической силы не имеют; свободно используются в НИР"
    notes: "Фактическая трудоёмкость 260 / 253,0 = 1,03 чел.-ч/м² (расчёт по итогам документа), для сравнения: карта 6 из 7353 даёт 0,86. Звено Б в один день работало неполным составом (К3 отсутствовал) — пример исключения в истории"
    

