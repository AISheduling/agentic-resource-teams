sources:

  - id: SRC.TTK_WALLS
    title: "Типовая технологическая карта (ТТК) «Кирпичная кладка наружных стен и внутренних перегородок с монтажом перемычек»"
    author: null              
    year: 2013             
    role: tech_card
    used_in: [PKG-01, PKG-02, PKG-03, PKG-04, PKG-05, PKG-08]
    file: "01_tehkarta_1.pdf"           
    url: https://smetnoedelo.ru/docs/1187.html
    format: "PDF с текстовым слоем, 47 стр.; пронумерованные пункты, таблицы, рисунки-схемы; при выгрузке теряются дроби (1½ кирпича пишется как «1 кирпича»)"
    volume: "47 стр.; для пилота проверены п. 5.4–5.5 (стр. 23–24, звено «двойка» К 3–4 разр. + К 2 разр.)"
    access: "открытый просмотр"
    license: "не установлена"
    notes: "Самый востребованный источник (6 пакетов)"
    
  - id: SRC.TK_INNER_380
    title: "Технологическая карта «Кирпичная кладка внутренних стен» (стены 380 мм, 1,5 кирпича)"
    author: Институт ПТИ Минсевзапстроя СССР      
    year: 1989
    role: tech_card
    used_in: [PKG-01, PKG-03, PKG-08]
    file: "02_tehkarta_2.pdf"
    url: https://files.stroyinf.ru/Data1/44/44556/
    format: "PDF с текстовым слоем, 22 стр.; пронумерованные пункты 1–6, таблицы 1–4 (материалы, оснастка); при выгрузке теряются индексы (м³ пишется как «м»)"
    volume: "22 стр.; для пилота проверены стр. 1–2 (п. 1.1, 2.1–2.4, звено «двойка» 4+2), стр. 4 (п. 2.6 подача), стр. 20–21 (табл. 4)"
    access: "открытый просмотр"
    license: "не установлена"
    notes: "Трудозатрат (чел.-ч) в самой карте нет, они берутся из ГЭСН. Расход материалов в табл. 3 (0,395 тыс. шт. кирпича, 0,234 м³ раствора) совпадает с ГЭСН-2001"
    

  - id: SRC.TK_OUTER_3
    title: "Типовая технологическая карта «Кирпичная кладка наружных стен» (простые стены с расшивкой швов, согласно ТК 3.01.01.03)"
    author: ОАО "ПКТИпромстрой"
    year: 2006
    role: tech_card
    used_in: [PKG-06, PKG-07, PKG-01] 
    file: "03_tehkarta_3.pdf"
    url: https://files.stroyinf.ru/Data2/1/4293839/4293839854.htm
    format: "PDF с текстовым слоем, 18 стр.; нумерованные разделы, таблица состава бригады (стр. 2)"
    volume: "18 стр.; для пилота проверена стр. 2 (бригада: каменщик 3 разр. — 10, монтажник-такелажник 2 разр. — 2, плотник 4 разр. — 1, плотник 2 разр. — 2)"
    access: "открытый просмотр"
    license: "© ОАО ПКТИпромстрой; используются только извлечения со ссылкой на пункт"
    notes: "В карте итоги по бригаде и по звеньям не сходятся (4 звена «двойка» и 10 каменщиков): основа конфликтного PKG-06"
    

  - id: SRC.LABOR_7353
    title: "Комплект карт трудовых процессов на кладку кирпичных стен зданий, 7353 ТК"
    author: "ОАО ПКТИпромстрой"
    year: 2006
    role: labor_process_card
    used_in: [PKG-01, PKG-04 (план)]
    file: "5a524561-_____________.pdf"
    url: https://files.stroyinf.ru/Data2/1/4293826/4293826267.pdf
    format: "PDF с текстовым слоем, 50 стр.; 6 карт + приложение А (ведомость инструмента); таблицы «выработка / затраты труда», исполнители с условными обозначениями (К-1, К-2); теряются индексы (м³)"
    volume: "50 стр.; нужны карты 5 (стены 38 см, стр. 38–43) и 6 (перегородки 12 см, стр. 44–48); карты 1–4 (стены 51 см, стр. 5–37) в пилотных пакетах не нужны"
    access: "открытый просмотр"
    license: "© ОАО ПКТИпромстрой; используются только извлечения со ссылкой на пункт"
    notes: "Карта 5 для той же стены 380 мм даёт звено 4 разр. + 3 разр. (а не 4 + 2, как в ТК2) и 3,23 чел.-ч/м³ (стр. 38): третье значение нормы наряду с 5,21 (ГЭСН-2001) и 4,38 (ГЭСН-2022). Карта 6 даёт 0,86 чел.-ч на 1 м² перегородки (стр. 44)."
    
  - id: SRC.GESN_2001
    title: "ГЭСН 81-02-08-2001. Государственные элементные сметные нормы на строительные и специальные строительные работы. Часть 8. Конструкции из кирпича и блоков"
    author: "Мнстрой Роиссии (приказ от 30.01.2014 № 31/пр в ред. приказа от 07.02.2014 № 39/пр)"
    year: 2014             
    role: norm_estimate
    used_in: [PKG-01, PKG-02, PKG-03, PKG-04, PKG-06]
    file: "bada785a-4293774673.pdf"
    url: https://files.stroyinf.ru/Data2/1/4293774/4293774673.pdf
    format: "PDF с текстовым слоем, 39 стр.; таблицы норм (шифр 08-02-001-07 и т. д.), измеритель в заголовке таблицы; при выгрузке теряются индексы (1½ кирпича → «1А кирпича»), столбцы шифров переносятся на следующую страницу"
    volume: "39 стр.; для пилота проверены стр. 8–9 (табл. 08-02-001: 08-02-001-07 = 5,21 чел.-ч/м³, разряд 2,7, кран 0,4 маш.-ч; табл. 08-02-002)"
    access: "открытый просмотр"
    license: "официальный нормативный документ; извлечения со ссылкой на таблицу и графу"
    notes: "Даёт трудозатраты на единицу объёма, состав бригады не задаёт"
    

  - id: SRC.GESN_2022
    title: "ГЭСН 81-02-08-2022. Сметные нормы на строительные работы. Сборник 8. Конструкции из кирпича и блоков"
    author: "Мнстрой Роиссии (приказ от 30.12.2021 № 1046(ред. от 19.05.2025))""
    year: 2025
    role: norm_estimate
    used_in: [PKG-01, PKG-02 (план), PKG-03 (план), PKG-04 (план), PKG-06 (план)]
    file: "a23763d1-_____________.pdf"
    url: https://cs.smetnoedelo.ru/gesn2/sbor-08/
    format: "PDF с текстовым слоем, 45 стр.; таблицы норм с кодами ресурсов вида 1-100-27 («Средний разряд работы 2,7»); столбцы нормы не по порядку, часть ячеек пуста"
    volume: "45 стр.; для пилота проверены стр. 10–11 (табл. 08-02-001: 08-02-001-07 = 4,38 чел.-ч/м³, кран 0,4 маш.-ч)"
    access: "открытый просмотр"
    license: "официальный нормативный документ; извлечения со ссылкой на таблицу и графу"
    notes: "Для той же нормы 08-02-001-07 даёт 4,38 вместо 5,21 в издании 2001 (разница около 19 %)"
    
  - id: SRC.PROFSTD_MASON
    title: "Профессиональный стандарт «Каменщик» (рег. номер 350)"
    author: "Минтруд России (приказ от 25.12.2014 № 1150н)"
    year: 2014
    role: professional_standard
    used_in: [PKG-05, PKG-01 (план)]
    file: "04_profstandart_kamenshchik.pdf"
    url: https://test.sfedu.ru/files/upload/sts/56960/%D0%9F%D0%A1_350.%20%D0%9A%D0%B0%D0%BC%D0%B5%D0%BD%D1%89%D0%B8%D0%BA.pdf
    format: "PDF с текстовым слоем, 19 стр.; обобщённые трудовые функции, уровни квалификации, особые условия допуска"
