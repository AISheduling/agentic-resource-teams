# ПИЛОТНЫЙ ПАКЕТ PKG-06 (проверен по оригиналам PDF и проектным документам; ждёт проверки экспертом)
# Номера страниц = страницы PDF (первая страница файла = 1). Источники: docs/sources.yaml.
# Историческая часть опирается на СИНТЕТИЧЕСКИЙ акт (вымышленные данные).

id: PKG-06
title: "Внутренние несущие стены 380 мм из керамических камней: история (звено «тройка») против карты («двойка»)"
status: checked_against_pdf
kind: history
why_this_kind: >
  В истории (акт) стена выложена звеном «тройка» (4+3+2), в технологической карте «двойка» (4+2),
  в карте труда 4+3. Все три могут быть допустимыми режимами. Система должна отличать наблюдение
  из истории от норматива и не считать «тройку» ошибкой.

input:
  work_description: >
    Кладка внутренних несущих стен толщиной 380 мм из керамических камней под штукатурку, с
    укладкой сборных железобетонных перемычек над проёмами.
  volume: {value: 66.0, unit: "м3"}          # УСЛОВНОЕ значение, совпадает с объёмом в акте
  conditions:
    season: null
    lifting: "кран (тип не задан)"
  masked_fields: [crew_composition, qualifications, equipment, labor_norm, duration]
  resource_catalog:                          # УСЛОВНЫЙ каталог
    roles: ["каменщик 2 разр.", "каменщик 3 разр.", "каменщик 4 разр.", "машинист крана"]
    equipment: ["кран башенный", "кран автомобильный 16 т", "подмости стоечные", "ящик для раствора"]
  variants:
    V1: "полное описание"
    V2: "внутренние стены 380 мм из камней, 66 м3"
    V3: "бригада для кладки несущих внутренних стен из керамических камней"

sources:
  - {id: SRC.HIST_ACT, role: history_synthetic, use: main}
  - {id: SRC.TK_INNER_380, role: example}
  - {id: SRC.LABOR_7353, role: labor_process_card}
  - {id: SRC.TTK_WALLS, role: example, use: "ЕНиР для стен из камней"}
  - {id: SRC.GESN_2022, role: norm}
  - {id: SRC.GESN_2001, role: norm}

gold:
  claims:
    - id: C1
      entity: "акт № А-07/К (синтетика): внутренние несущие стены 380 мм из керамических камней, 01.09-14.09.2026"
      attribute: фактический состав звена
      value: "звено «тройка»: каменщик 4 разр. x1, каменщик 3 разр. x1, каменщик 2 разр. x1"
      src: {doc: SRC.HIST_ACT, pdf_page: 1, section: "разд. 3, «Состав звена»", quote: 'звено «тройка»: каменщик 4 разряда'}
      basis: observation
      check: confirmed
      mandatory: false
      note: "история не норматив: обязательным не является"

    - id: C2
      entity: "тот же акт"
      attribute: факт за период
      value: "66,0 м3 кладки и 25 перемычек; 234 чел.-ч; кран автомобильный 16 т и 25 т, 13,3 маш.-ч; выработка 2,26 м3 на чел.-день"
      src: {doc: SRC.HIST_ACT, pdf_page: 1, section: "разд. 3", quote: 'Отработано, чел.-ч'}
      basis: observation
      check: confirmed
      mandatory: false
      note: "234 чел.-ч включает и укладку перемычек (отдельной записи нет)"

    - id: C3
      entity: "кладка внутренних стен 380 мм, звено «двойка»"
      attribute: состав звена в технологической карте
      value: "каменщик 4 разр. x1; каменщик 2 разр. x1"
      src: {doc: SRC.TK_INNER_380, pdf_page: 2, section: "п. 2.4", quote: 'каменщик 4 разряда - 1 человек'}
      basis: document
      check: conflict
      conflict_with: C1
      mandatory: false
      applicability: "карта про полнотелый кирпич, а в запросе керамические камни"

    - id: C4
      entity: "кладка внутренних несущих стен 380 мм из керамических камней с проёмами под штукатурку, ЕНиР §Е3-3, табл. 3, №2б"
      attribute: норма времени
      value: 3.2
      unit: "чел.-ч/м3"
      src: {doc: SRC.TTK_WALLS, pdf_page: 26, section: "табл. 6.1, п. 2", quote: 'стен толщиной 380мм из'}
      basis: document
      check: conflict
      mandatory: false

    - id: C5
      entity: "норма 08-02-008-01, наружные стены из камней, простые, до 4 м; по ГЭСН-2022 п. 1.8.6 её применяют и для внутренних стен из камней"
      attribute: затраты труда рабочих (ГЭСН-2022)
      value: 3.85
      unit: "чел.-ч/м3"
      src: {doc: SRC.GESN_2022, pdf_page: 14, section: "табл. 08-02-008, графа 08-02-008-01", quote: 'Средний разряд работы 2,7 чел.-ч 3,85 3,73'}
      basis: document
      check: conflict
      mandatory: false
      note: "правило применения к внутренним стенам из камней: ГЭСН-2022 стр. 1, п. 1.8.6; в ГЭСН-2001 такого правила не найдено"

    - id: C6
      entity: "та же норма 08-02-008-01 (ГЭСН-2001)"
      attribute: затраты труда рабочих-строителей
      value: 4.58
      unit: "чел.-ч/м3"
      src: {doc: SRC.GESN_2001, pdf_page: 12, section: "табл. 08-02-008, графа 08-02-008-01", quote: '4,58 4,44 4,8'}
      basis: document
      check: conflict
      mandatory: false

    - id: C7
      entity: "карта труда 5: стены 38 см в 1,5 кирпича с расшивкой швов и армированием сеткой"
      attribute: состав и затраты труда
      value: "каменщик 4 разр. x1 (К-1); каменщик 3 разр. x1 (К-2); 3,23 чел.-ч/м3"
      src: {doc: SRC.LABOR_7353, pdf_page: 38, section: "карта 5, п. 1.2 и 2.1", quote: 'Каменщик 3 разряда (К-2)'}
      basis: document
      check: conflict
      mandatory: false
      applicability: "кирпич, не камни; с армированием"

  derived:
    - {id: D1, formula: "234 / 66", value: 3.545, unit: "чел.-ч/м3", note: "по акту, включая перемычки"}
    - {id: D2, formula: "(234 - 25 x 0,45) / 66", value: 3.375, unit: "чел.-ч/м3", note: "оценка только кладки: перемычки по ЕНиР 0,45 чел.-ч на проём (ТТК стр. 26); оценка не факт"}
    - {id: D3, formula: "234 / 3", value: 78.0, unit: "ч", note: "78 ч = 9,75 смены; в акте 10 рабочих дней (9 по 8 ч и 1 по 6 ч), сходится"}
    - {id: D4, formula: "H = q x n при q = 66: ЕНиР 3,2; ГЭСН-2022 3,85; ГЭСН-2001 4,58; карта 3,23", value: "211,2; 254,1; 302,28; 213,18 чел.-ч"}

  # Формула (ADR-0004, обозначения подтверждены научным руководителем 05.11.2026):
  #   H = q * n * k  (общая трудоёмкость, чел.-ч);  d ≈ H / m  (m = число работников, ОДНОВРЕМЕННО выполняющих работу);
  #   η = 1: совместная работа идеальна, потерь на координацию нет. Это упрощение семестра, а не утверждение,
  #   что работу можно ускорить пропорционально числу людей. Допустимость m (звено, делянка) должна быть обоснована отдельно.
  #   Пример научника: 100 м2 x 0,5 чел.-ч/м2 x k=1 = 50 чел.-ч; 5 человек -> около 10 ч.
  admissible_modes:
    - mode_id: M1
      roles: [{role: каменщик, grade: 4, count: 1}, {role: каменщик, grade: 3, count: 1}, {role: каменщик, grade: 2, count: 1}]
      labor_variants:                        # m = 3, d = H / 3
        by_history:    {H: 234.0,  d_hours: 78.0}
        by_ENiR:       {n: 3.2,  H: 211.2,  d_hours: 70.4}
        by_GESN_2022:  {n: 3.85, H: 254.1,  d_hours: 84.7}
        by_GESN_2001:  {n: 4.58, H: 302.28, d_hours: 100.76}
        by_card_7353:  {n: 3.23, H: 213.18, d_hours: 71.06}
      equipment: [кран автомобильный 16 т (25 т при ремонте), подмости стоечные x3, ящик для раствора 0,25 м3 x3]
      supported_by: [C1, C2]
      admissible: true
      why: "реально выполнено; история"
    - mode_id: M2
      roles: [{role: каменщик, grade: 4, count: 1}, {role: каменщик, grade: 2, count: 1}]
      labor_variants:                        # m = 2, d = H / 2
        by_ENiR:       {n: 3.2,  H: 211.2,  d_hours: 105.6}
        by_GESN_2022:  {n: 3.85, H: 254.1,  d_hours: 127.05}
        by_GESN_2001:  {n: 4.58, H: 302.28, d_hours: 151.14}
        by_card_7353:  {n: 3.23, H: 213.18, d_hours: 106.59}
      supported_by: [C3, C4, C5, C6]
      admissible: conditional
      why: "карта для кирпича; для камней нужен эксперт"
    - mode_id: M3
      roles: [{role: каменщик, grade: 4, count: 1}, {role: каменщик, grade: 3, count: 1}]
      labor_variants:
        by_card_7353:  {n: 3.23, H: 213.18, d_hours: 106.59}
      supported_by: [C7]
      admissible: conditional
      why: "карта труда для 1,5 кирпича с армированием"

  not_found:
    - {id: U1, what: "разряд машиниста автомобильного крана", note: "в акте не указан"}
    - {id: U2, what: "причина выбора «тройки» вместо «двойки»", note: "акт не объясняет"}
    - {id: U3, what: "трудозатраты на перемычки отдельно от кладки", note: "в акте одна сумма"}
    - {id: U4, what: "доказанность m = 3 и m = 2 как числа одновременно работающих", note: "для истории m = 3 подтверждается актом (78 ч = 9,75 смены, 10 рабочих дней), для режимов M2 и M3 m = 2 взят из состава звена карты; η = 1 не проверяет, что все работают одновременно на этом объёме"}

  traps:
    - {id: T1, wrong: "считать акт нормативом", why: "это наблюдение из истории (синтетика)"}
    - {id: T2, wrong: "считать «тройку» ошибкой из-за карты с «двойкой»", why: "история даёт допустимый режим, а не опровергает карту"}
    - {id: T3, wrong: "брать кран башенный 8 т из ГЭСН для истории", why: "в акте автомобильный кран 16 т и 25 т"}
    - {id: T4, wrong: "делить 234 на 66 и называть это нормой кладки", why: "234 включает перемычки (D2)"}
    - {id: T5, wrong: "норма 5,21 или 4,38 (08-02-001-07, кирпич)", why: "в запросе керамические камни"}

pass_criteria:
  must:
    - "оба состава («тройка» из акта и «двойка» из карты) названы допустимыми с указанием типа источника (история, карта)"
    - "значения трудоёмкости раздельно, без усреднения; для каждого режима d = H/m с указанным m (3 или 2)"
    - "пометка: 234 чел.-ч включает перемычки"
    - "U1-U4 неизвестны"
  must_not:
    - "история выдана за норматив"
    - "значения из ловушек T1-T5"

open_for_expert:
  - "годится ли ГЭСН 08-02-008-01 (наружные стены из камней) для внутренних стен из камней"
  - "как использовать историю при планировании: как факт, как оценку, как поправку к норме"
  - "можно ли считать совпадение d = H/m с историей (78 ч при m = 3) подтверждением допущения η = 1 или это совпадение одного случая"
  - "акт синтетический: принимает ли научник такую историю"

notes: >
  Данные акта вымышленные (метка в документе). Расчёт D1-D4 мой. Совпадение 78 ч с десятью
  рабочими днями показывает, что при КПД = 1 формула d = H / m здесь согласуется с историей.
