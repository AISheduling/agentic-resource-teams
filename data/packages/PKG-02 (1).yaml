# ПИЛОТНЫЙ ПАКЕТ PKG-02 (проверен по оригиналам PDF; ждёт проверки экспертом)
# Как читать: docs/pilot/HOWTO-pilot-package.md. Номера страниц = страницы PDF (первая страница файла = 1).
# Идентификаторы источников берутся из docs/sources.yaml.

id: PKG-02
title: "Наружные несущие стены 770 мм из керамических камней с облицовкой лицевым кирпичом, типовой этаж секции 5"
status: checked_against_pdf     # draft -> checked_against_pdf -> expert_confirmed
kind: standard                  # все ключевые ответы лежат в одном документе (ТТК); ГЭСН прямой нормы не даёт
why_this_kind: >
  Состав звена и норма времени для стены 770 мм прямо названы в одной технологической карте. Это
  «стандартный» пакет, но с ловушкой: в ГЭСН есть правдоподобные нормы для наружных стен
  (08-02-008-01 и 08-02-010), и ни одна из них не относится к стене 770 мм с облицовкой.

input:
  work_description: >
    Кладка наружных несущих стен толщиной 770 мм из керамических камней с облицовкой лицевым
    кирпичом, типовой этаж жилой секции.
  volume: {value: 62.5, unit: "м3"}          # объём взят из ТТК, табл. 6.1, п. 1 (не условный)
  conditions:
    season: null                             # в запросе не задан
    floor_height_m: null
    lifting: "башенный кран"                 # УСЛОВНОЕ значение
  masked_fields: [crew_composition, qualifications, labor_norm, winter_coefficient]
  resource_catalog:                          # УСЛОВНЫЙ каталог, придуман для примера
    roles: ["каменщик 2 разр.", "каменщик 3 разр.", "каменщик 4 разр.", "каменщик 5 разр.", "плотник 4 разр.", "монтажник-такелажник 2 разр."]
    equipment: ["кран башенный", "установка для подачи раствора", "подмости"]
  variants:
    V1: "полное описание (как выше)"
    V2: "наружные стены 770 мм, 62,5 м3"
    V3: "бригада для кладки толстых наружных стен с лицевым кирпичом"

sources:
  - {id: SRC.TTK_WALLS, role: example, use: main}
  - {id: SRC.GESN_2001, role: norm, use: distractor}
  - {id: SRC.GESN_2022, role: norm, use: distractor}

gold:
  claims:
    - id: C1
      entity: "кладка наружных несущих стен секций 5, 6, 7, звено «четверка»"
      attribute: состав звена
      value: "каменщик 4-5 разр. x1; каменщик 3 разр. x1; каменщик 2 разр. x2"
      src: {doc: SRC.TTK_WALLS, pdf_page: 15, section: "п. 5.2, рис. 10", quote: 'К - каменщик 4- 5 разряда'}
      basis: document
      check: confirmed
      mandatory: true
      why_mandatory: "п. 5.2 прямо привязывает звено к наружным несущим стенам секций 5-7"

    - id: C2
      entity: "кладка наружных несущих стен толщиной 770 мм из керамических камней с облицовкой лицевым кирпичом"
      attribute: норма времени
      value: 3.1
      unit: "чел.-ч/м3"
      src: {doc: SRC.TTK_WALLS, pdf_page: 26, section: "табл. 6.1, п. 1; основание ЕНиР §Е3-8, табл. 2, №2а", quote: 'толщиной 770 мм из'}
      basis: document
      check: confirmed
      mandatory: false
      note: "единицы измерения проверены по изображению страницы: м3"

    - id: C3
      entity: "тот же вид работ, секция 5"
      attribute: трудозатраты на объём
      value: 193.75
      unit: "чел.-ч"
      src: {doc: SRC.TTK_WALLS, pdf_page: 26, section: "табл. 6.1, п. 1, объём 62,5 м3", quote: '62,5'}
      basis: document
      check: confirmed
      mandatory: false
      note: "62,5 x 3,1 = 193,75: сходится с таблицей"

    - id: C4
      entity: "работы в зимних условиях (декабрь-март), г. Санкт-Петербург"
      attribute: поправочный коэффициент к нормам времени
      value: 1.13
      src: {doc: SRC.TTK_WALLS, pdf_page: 32, section: "примечание к табл. 6.1-6.3, ЕНиР Общая часть, прил. 3, табл. 1", quote: 'К= 1,13'}
      basis: document
      check: confirmed_partly
      mandatory: false
      applicability: "только если сезон зима и объект в Санкт-Петербурге; в запросе сезон не задан, поэтому по умолчанию не применять"

    - id: C5
      entity: "подача материалов для кладки стен и монтажа перемычек"
      attribute: подъёмное оборудование
      value: "башенные краны КБ-503 и КБ-403"
      src: {doc: SRC.TTK_WALLS, pdf_page: 2, section: "п. 1.3", quote: 'башенными кранами КБ - 503 и КБ- 403'}
      basis: document
      check: confirmed
      mandatory: false

    - id: C6
      entity: "рабочие, принимающие груз на рабочих местах каменщиков"
      attribute: требование к допуску
      value: "обучены и имеют удостоверение стропальщика; радиотелефонная связь с машинистом башенного крана"
      src: {doc: SRC.TTK_WALLS, pdf_page: 33, section: "п. 8.3", quote: 'удостоверение стропальщика'}
      basis: document
      check: confirmed
      mandatory: true
      why_mandatory: "условие запроса «башенный кран» совпадает с условием карты; требование безопасности прямо названо"

  derived:                      # посчитано мной по значениям выше, источниками не заявлено
    - {id: D1, formula: "H = q x n x k = 62,5 x 3,1 x 1,0", value: 193.75, unit: "чел.-ч"}
    - {id: D2, formula: "d = H / m = 193,75 / 4 (m = 4 человека звена «четверка», η = 1)", value: 48.44, unit: "ч (6,05 смены по 8 ч)", note: "идеальная оценка: все четверо работают одновременно без потерь"}
    - {id: D3, formula: "зимой: H = 193,75 x 1,13", value: 218.94, unit: "чел.-ч", d_hours: 54.73, shifts_8h: 6.84}

  # Формула (ADR-0004, обозначения подтверждены научным руководителем 05.11.2026):
  #   H = q * n * k  (общая трудоёмкость, чел.-ч);  d ≈ H / m  (m = число работников, ОДНОВРЕМЕННО выполняющих работу);
  #   η = 1: совместная работа идеальна, потерь на координацию нет. Это упрощение семестра, а не утверждение,
  #   что работу можно ускорить пропорционально числу людей. Допустимость m (звено, делянка) должна быть обоснована отдельно.
  #   Пример научника: 100 м2 x 0,5 чел.-ч/м2 x k=1 = 50 чел.-ч; 5 человек -> около 10 ч.
  admissible_modes:
    - mode_id: M1
      roles: [{role: каменщик, grade: 4, count: 1}, {role: каменщик, grade: 3, count: 1}, {role: каменщик, grade: 2, count: 2}]
      labor: {q: 62.5, n: 3.1, k: 1.0, H: 193.75, m: 4, eta: 1, d_hours: 48.44, d_shifts_8h: 6.05}
      equipment: [башенный кран КБ-403 или КБ-503]
      supported_by: [C1, C2, C3, C5, C6]
      admissible: true
    - mode_id: M2
      roles: [{role: каменщик, grade: 5, count: 1}, {role: каменщик, grade: 3, count: 1}, {role: каменщик, grade: 2, count: 2}]
      labor: {q: 62.5, n: 3.1, k: 1.0, H: 193.75, m: 4, eta: 1, d_hours: 48.44, d_shifts_8h: 6.05}
      equipment: [башенный кран КБ-403 или КБ-503]
      supported_by: [C1, C2, C3, C5, C6]
      admissible: true
      why: "в п. 5.2 назван диапазон «4-5 разряда»"

  not_found:
    - {id: U1, what: "ГЭСН-норма для стены 770 мм с облицовкой", note: "в табл. 08-02-010 толщины 250, 380, 510, 640 мм (ГЭСН-2001 стр. 14, ГЭСН-2022 стр. 16), 770 мм нет"}
    - {id: U2, what: "разряд машиниста башенного крана", note: "ТТК называет краны, но не разряд"}
    - {id: U3, what: "численность стропальщика или такелажника как отдельной роли", note: "п. 8.3 даёт требование (удостоверение), число не указано"}
    - {id: U4, what: "зимний коэффициент для объекта вне Санкт-Петербурга", note: "K = 1,13 дан только для СПб"}
    - {id: U5, what: "доказанность m = 4 как числа одновременно работающих", note: "звено из 4 человек задано ТТК п. 5.2, но длина делянки и допустимость одновременной работы четверых на заданном объёме 62,5 м3 в пакете не проверены; формула с η = 1 это не проверяет"}

  traps:
    - {id: T1, wrong: "норма 4,58 (ГЭСН-2001) или 3,85 (ГЭСН-2022) чел.-ч/м3", why: "это 08-02-008-01: наружные стены из камней БЕЗ облицовки, простые, до 4 м (ГЭСН-2022 п. 1.8.6, стр. 1); значения ГЭСН-2001 стр. 12, ГЭСН-2022 стр. 14"}
    - {id: T2, wrong: "применить K = 1,13 без указания зимы и Санкт-Петербурга", why: "коэффициент условный (C4)"}
    - {id: T3, wrong: "звено «двойка» каменщик 3-4 разр. + каменщик 2 разр.", why: "это звено для внутренних несущих стен и перегородок (п. 5.5, стр. 23-24)"}
    - {id: T4, wrong: "норма 08-02-010-05 (640 мм) как «ближайшая» к 770 мм", why: "другая толщина, перенос не обоснован"}

pass_criteria:
  must:
    - "звено «четверка»: 4-5 разр. x1, 3 разр. x1, 2 разр. x2, с источником (ТТК п. 5.2)"
    - "норма 3,1 чел.-ч/м3 с источником (ТТК табл. 6.1, ЕНиР)"
    - "условие «стропальщик» для работников, принимающих груз"
    - "длительность считается по H = q·n·k и d = H/m: 193,75 чел.-ч и 48,44 ч при m = 4; зимой 218,94 чел.-ч и 54,73 ч, с оговоркой про СПб"
    - "U1-U5 названы неизвестными или условными"
  must_not:
    - "значения из ловушек T1-T4"
    - "обязательное требование без ссылки на источник"

open_for_expert:
  - "считать ли норму ЕНиР (устаревший документ) допустимым основанием, если ГЭСН не даёт прямой нормы"
  - "допустимо ли использовать 08-02-008-01 как приближение (без облицовки)"
  - "можно ли принять m = 4 (все члены звена работают одновременно) при объёме 62,5 м3; задаёт ли ТТК предел"
  - "условные значения: каталог ресурсов, кран, высота этажа"

notes: >
  Пакет показывает, что «standard» редко бывает «чистым»: ответ лежит в одном документе, но соседние
  нормативы дают правдоподобные и неприменимые значения. Проверка применимости норм важнее поиска.
