    - Treat 2014 standard as verified current law.

open_for_expert:
  - Confirm current professional standard and work-at-height requirements.
  - Confirm whether partial claims count toward coverage.

notes: Synthetic input and resource catalog; source facts are documentary examples, not observed site data. Expert review pending. PDF page numbering starts at 1.
