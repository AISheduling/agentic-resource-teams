    V2: Кладка наружных несущих стен толщиной 770 мм из керамических камней с облицовкой лицевым кирпичом, 10 м3
    V3: 'Подобрать звено для: Кладка наружных несущих стен толщиной 770 мм из керамических камней с облицовкой лицевым кирпичом. Январь, город не указан.'

sources:
