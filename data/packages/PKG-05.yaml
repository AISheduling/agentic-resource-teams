# ПИЛОТНЫЙ ПАКЕТ PKG-05 (проверен по оригиналам PDF; ждёт проверки экспертом)
# Номера страниц = страницы PDF (первая страница файла = 1). Источники: docs/sources.yaml.

id: PKG-05
title: "Наружные стены 2,5 кирпича, бригада 15 человек: состав и итоги в карте не сходятся"
status: checked_against_pdf
kind: conflict
why_this_kind: >
  Внутри одной карты число каменщиков (10) не равно числу, следующему из «4 звеньев двойка» (8), а
  итоговая трудоёмкость не сходится с числом рабочих и сменами. Кроме того, ЕНиР карты даёт 3,8
  чел.-ч/м3, а ГЭСН 5,4 (2001) и 4,54 (2022). Система должна показать расхождения, а не выбрать.

input:
  work_description: >
    Кладка простых наружных стен из кирпича толщиной 2,5 кирпича с расшивкой швов, типовой этаж
    жилого дома.
  volume: {value: 265, unit: "м3"}           # из ТК 3.01.01.03, табл. 3 (не условный)
  conditions:
    season: "лето"                           # карта: «работы выполняют в летний период, в две смены»
    shifts: 2
    lifting: "башенный кран"
  masked_fields: [crew_composition, qualifications, equipment, labor_norm, duration]
  resource_catalog:                          # УСЛОВНЫЙ каталог
    roles: ["каменщик 3 разр.", "каменщик 4 разр.", "монтажник-такелажник 2 разр.", "плотник 2 разр.", "плотник 4 разр.", "машинист башенного крана"]
    equipment: ["кран башенный", "подмости шарнирно-пакетные", "установка для подачи раствора"]
  variants:
    V1: "полное описание"
    V2: "наружные стены 2,5 кирпича, 265 м3"
    V3: "бригада для кладки наружных стен типового этажа"

sources:
  - {id: SRC.TK_OUTER_3, role: example, use: main}
  - {id: SRC.GESN_2001, role: norm}
  - {id: SRC.GESN_2022, role: norm}

gold:
  claims:
    - id: C1
      entity: "типовой этаж жилого дома серии 1-447С-34, кладка наружных стен"
      attribute: состав бригады
      value: "15 человек: каменщик 3 разр. x10; монтажник-такелажник 2 разр. x2; плотник 4 разр. x1; плотник 2 разр. x2"
      src: {doc: SRC.TK_OUTER_3, pdf_page: 2, section: "разд. 2, состав бригады (начало на стр. 1)", quote: 'каменщик 3 разряда - 10'}
      basis: document
      check: conflict
      conflict_with: C2
      mandatory: true
      why_mandatory: "карта прямо про эту работу"

    - id: C2
      entity: "кирпичная кладка стен с расшивкой швов"
      attribute: организация
      value: "4 звена «двойка» в две смены; в звене два каменщика 3 разр."
      src: {doc: SRC.TK_OUTER_3, pdf_page: 2, section: "разд. 2", quote: '4 звеньями «двойка» в две смены'}
      basis: document
      check: conflict
      conflict_with: C1
      mandatory: true

    - id: C3
      entity: "кладка наружных стен с совмещёнными вертикальными швами толщиной 2,5 кирпича, ЕНиР §Е3-3Б п. 4а"
      attribute: норма времени и трудозатраты
      value: "3,8 чел.-ч/м3; 265 м3 -> 1007 чел.-ч"
      src: {doc: SRC.TK_OUTER_3, pdf_page: 9, section: "табл. 3, п. 1", quote: 'Е3-3Б, 3,8'}
      basis: document
      check: conflict
      conflict_with: [C5, C6]
      mandatory: false

    - id: C4
      entity: "технико-экономические показатели на типовой этаж"
      attribute: итого
      value: "1251,69 чел.-ч; 92,41 маш.-ч; 12,2 смены; выработка 1,73 м3 на рабочего в смену"
      src: {doc: SRC.TK_OUTER_3, pdf_page: 14, section: "разд. 8", quote: '1251,69'}
      basis: document
      check: conflict
      mandatory: false

    - id: C5
      entity: "норма 08-02-001-01, наружные стены простые, высота этажа до 4 м (ГЭСН-2001)"
      attribute: затраты труда рабочих-строителей
      value: 5.4
      unit: "чел.-ч/м3"
      src: {doc: SRC.GESN_2001, pdf_page: 8, section: "табл. 08-02-001, графа 08-02-001-01", quote: 'Расшивка швов кладки наружных стен'}
      basis: document
      check: conflict
      conflict_with: C3
      mandatory: false
      note: "значение 5,4 чел.-ч и средний разряд 2,7 в графе 08-02-001-01 той же страницы; в составе работ ГЭСН-2001 есть расшивка швов"

    - id: C6
      entity: "та же норма 08-02-001-01 (ГЭСН-2022)"
      attribute: затраты труда рабочих
      value: 4.54
      unit: "чел.-ч/м3"
      src: {doc: SRC.GESN_2022, pdf_page: 10, section: "табл. 08-02-001, графа 08-02-001-01", quote: 'Средний разряд работы 2,7'}
      basis: document
      check: conflict
      conflict_with: C3
      mandatory: false
      note: "в составе работ ГЭСН-2022 для норм 001-01...001-08 расшивка швов не названа"

    - id: C7
      entity: "рекомендуемые машины и оборудование"
      attribute: перечень
      value: "кран башенный КБ-100.1 (до 5 т) или КБ-160 (до 8 т) или кран гусеничный МКГ-16 (16 т); установка для подачи раствора СО-126"
      src: {doc: SRC.TK_OUTER_3, pdf_page: 3, section: "табл. 1", quote: 'Установка для подачи'}
      basis: document
      check: confirmed
      mandatory: false

  derived:                      # посчитано мной, источником не заявлено; требует подтверждения экспертом
    - {id: D1, formula: "4 звена x 2 каменщика", value: 8, note: "против 10 каменщиков в составе бригады"}
    - {id: D2, formula: "15 чел. x 12,2 смены x 8 ч", value: 1464.0, unit: "чел.-ч", note: "против 1251,69 в итоге (меньше на 14,5 %)"}
    - {id: D3, formula: "1251,69 / 8 / 12,2", value: 12.82, unit: "рабочих", note: "против 15 в составе"}
    - {id: D4, formula: "265 / (1251,69 / 8)", value: 1.69, unit: "м3 на рабочего в смену", note: "против 1,73 в итоге"}
    - {id: D5, formula: "H = q x n: ЕНиР 265 x 3,8; ГЭСН-2001 265 x 5,4; ГЭСН-2022 265 x 4,54", value: "1007; 1431; 1203,1 чел.-ч"}

  # Формула (ADR-0004, обозначения подтверждены научным руководителем 05.11.2026):
  #   H = q * n * k  (общая трудоёмкость, чел.-ч);  d ≈ H / m  (m = число работников, ОДНОВРЕМЕННО выполняющих работу);
  #   η = 1: совместная работа идеальна, потерь на координацию нет. Это упрощение семестра, а не утверждение,
  #   что работу можно ускорить пропорционально числу людей. Допустимость m (звено, делянка) должна быть обоснована отдельно.
  #   Пример научника: 100 м2 x 0,5 чел.-ч/м2 x k=1 = 50 чел.-ч; 5 человек -> около 10 ч.
  admissible_modes:
    - mode_id: M1
      roles: [{role: каменщик, grade: 3, count: 10}, {role: монтажник-такелажник, grade: 2, count: 2}, {role: плотник, grade: 4, count: 1}, {role: плотник, grade: 2, count: 2}]
      labor_variants:                        # H только для каменщиков; d = H / m, m = 10 каменщиков, η = 1
        by_ENiR_card:   {n: 3.8,  H: 1007.0,  m_masons: 10, d_hours: 100.7}
        by_GESN_2001:   {n: 5.4,  H: 1431.0,  m_masons: 10, d_hours: 143.1}
        by_GESN_2022:   {n: 4.54, H: 1203.1,  m_masons: 10, d_hours: 120.31}
      equipment: [кран башенный (КБ-100.1 или КБ-160), СО-126]
      supported_by: [C1, C3, C5, C6, C7]
      admissible: conditional
      why: "состав взят из списка бригады; конфликтует с C2"
    - mode_id: M2
      roles: [{role: каменщик, grade: 3, count: 8}, {role: монтажник-такелажник, grade: 2, count: 2}, {role: плотник, grade: 4, count: 1}, {role: плотник, grade: 2, count: 2}]
      labor_variants:
        by_ENiR_card:   {n: 3.8,  H: 1007.0,  m_masons: 8, d_hours: 125.88}
        by_GESN_2001:   {n: 5.4,  H: 1431.0,  m_masons: 8, d_hours: 178.88}
        by_GESN_2022:   {n: 4.54, H: 1203.1,  m_masons: 8, d_hours: 150.39}
      equipment: [кран башенный (КБ-100.1 или КБ-160), СО-126]
      supported_by: [C2, C3, C5, C6, C7]
      admissible: conditional
      why: "4 звена двойка = 8 каменщиков; число остальных рабочих взято из списка бригады"

  not_found:
    - {id: U1, what: "разряд машиниста башенного крана", note: "в карте не указан, в ГЭСН есть только часы"}
    - {id: U2, what: "зимние условия", note: "карта только для лета"}
    - {id: U3, what: "какой из составов (10 или 8 каменщиков) верен", note: "решение эксперта"}
    - {id: U4, what: "доказанность m = 10 (или 8) как числа одновременно работающих", note: "оба значения m берутся из состава бригады; в карте не сказано, что все каменщики работают на одной захватке одновременно, а η = 1 это не проверяет. Остальные рабочие (такелажники, плотники) в H и m не входят"}

  traps:
    - {id: T1, wrong: "бригада «15 каменщиков»", why: "в бригаде 10 каменщиков, остальные рабочие других профессий"}
    - {id: T2, wrong: "считать итог 12,2 смены, 15 человек и 1251,69 чел.-ч согласованными", why: "они не сходятся (D2, D3)"}
    - {id: T3, wrong: "норма 4,80 (среднее 5,4 и 4,54) или 4,24 (среднее трёх)", why: "усреднение запрещено"}
    - {id: T4, wrong: "норма 08-02-001-07 (внутренние стены) 5,21 или 4,38", why: "стена наружная"}
    - {id: T5, wrong: "применить K = 1,13 (зима, СПб из ТТК)", why: "в этой карте работы выполняются летом"}

pass_criteria:
  must:
    - "состав бригады (10/2/1/2) с источником и пометка, что число каменщиков не сходится с «4 звена двойка»"
    - "три значения нормы (3,8; 5,4; 4,54) раздельно, с источниками и изданием"
    - "не называть итоги карты согласованными"
    - "длительность считается по H = q·n и d = H/m отдельно для каждой нормы и каждого m (100,7 / 143,1 / 120,31 ч при m = 10; 125,88 / 178,88 / 150,39 ч при m = 8), без усреднения"
    - "U1-U4 неизвестны"
  must_not:
    - "усреднённая норма"
    - "значения из ловушек T1-T5"

open_for_expert:
  - "как верно читать «4 звена двойка в две смены» при 10 каменщиках (возможно, по 2 звена на смену)"
  - "считать ли D2-D4 дефектом карты или следствием другого способа счёта"
  - "принимать ли m равным числу каменщиков в бригаде при η = 1, если карта сама указывает 12,2 смены"
  - "условные значения: каталог ресурсов и тип крана"

notes: >
  Расчёты D1-D5 мои; они не утверждения источника. Расхождения подтверждают, что наличие числа в
  документе не означает согласованности документа.
