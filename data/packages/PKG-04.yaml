# ПИЛОТНЫЙ ПАКЕТ PKG-04 (проверен по оригиналам PDF; ждёт проверки экспертом)
# Номера страниц = страницы PDF (первая страница файла = 1). Источники: docs/sources.yaml.

id: PKG-04
title: "Укладка сборных железобетонных перемычек башенным краном: состав бригады в корпусе отсутствует"
status: checked_against_pdf
kind: partial
why_this_kind: >
  Нормы времени, оборудование и квалификационные требования для работы найдены, а состав и
  численность бригады нет. Правильное поведение системы: выдать то, что подтверждено, и явно
  назвать состав и численность неизвестными, не придумывая звено.

input:
  work_description: >
    Укладка сборных железобетонных перемычек над оконными и дверными проёмами в кирпичных
    стенах башенным краном.
  volume: {value: 40, unit: "проём"}         # УСЛОВНОЕ значение
  conditions:
    season: null
    lifting: "башенный кран"                 # УСЛОВНОЕ значение
  masked_fields: [crew_composition, qualifications, headcount, labor_norm, equipment]
  resource_catalog:                          # УСЛОВНЫЙ каталог
    roles: ["каменщик 2 разр.", "каменщик 3 разр.", "каменщик 4 разр.", "монтажник-такелажник 2 разр.", "машинист башенного крана"]
    equipment: ["кран башенный", "строп четырёхветвевой"]
  variants:
    V1: "полное описание"
    V2: "монтаж перемычек, 40 проёмов"
    V3: "бригада для установки перемычек в каменных стенах"

sources:
  - {id: SRC.TTK_WALLS, role: example, use: main}
  - {id: SRC.PROFSTD_MASON, role: professional_standard}
  - {id: SRC.HIST_ACT, role: history_synthetic}

gold:
  claims:
    - id: C1
      entity: "укладка сборных железобетонных перемычек оконных и дверных проёмов башенным краном, ЕНиР §Е3-16 №1а, б"
      attribute: норма времени
      value: "0,45 и 0,15 (две строки нормы)"
      unit: "чел.-ч на 1 проём"
      src: {doc: SRC.TTK_WALLS, pdf_page: 26, section: "табл. 6.1, п. 7", quote: 'башенным краном'}
      basis: document
      check: confirmed_partly
      mandatory: false
      note: "по таблице 71 проём: 0,45 x 71 = 31,95 и 0,15 x 71 = 10,65 чел.-ч. Что обозначает вторая строка (0,15), в карте не расшифровано"

    - id: C2
      entity: "сборные железобетонные перемычки в каменных стенах"
      attribute: подача башенным краном, последовательность
      value: "перемычки над дверными проёмами укладываются по ходу кладки; подача башенными кранами КБ-503 и КБ-403"
      src: {doc: SRC.TTK_WALLS, pdf_page: 23, section: "п. 5.4", quote: 'укладка сборных железобетонных перемычек над дверными проемами по ходу кладки'}
      basis: document
      check: confirmed
      mandatory: false

    - id: C3
      entity: "рабочие, принимающие груз от крана на рабочем месте"
      attribute: допуск
      value: "обучены, удостоверение стропальщика; радиотелефонная связь с машинистом"
      src: {doc: SRC.TTK_WALLS, pdf_page: 33, section: "п. 8.3", quote: 'удостоверение стропальщика'}
      basis: document
      check: confirmed
      mandatory: true
      why_mandatory: "работа выполняется краном (условие запроса); требование прямо названо"

    - id: C4
      entity: "профессиональный стандарт «Каменщик», трудовая функция B/02.2 «Кладка и разборка простых стен» (уровень 2)"
      attribute: монтаж перемычек как трудовое действие
      value: "включено: «Монтаж в каменных зданиях железобетонных перемычек над оконными и дверными проемами и нишами»"
      src: {doc: SRC.PROFSTD_MASON, pdf_page: 8, section: "п. 3.2.2", quote: 'Монтаж в каменных зданиях железобетонных перемычек'}
      basis: document
      check: confirmed
      mandatory: false
      note: "знания и умения: установка перемычек вручную и с грузоподъёмным оборудованием, стр. 9"

    - id: C5
      entity: "каменщик, особые условия допуска"
      attribute: инструктаж при использовании грузоподъёмного оборудования
      value: "инструктаж по выполнению работ с использованием стропального оборудования с отметкой о проверках знаний"
      src: {doc: SRC.PROFSTD_MASON, pdf_page: 4, section: "особые условия допуска к работе", quote: 'стропального оборудования'}
      basis: document
      check: confirmed
      mandatory: true
      why_mandatory: "стандарт прямо требует при использовании грузоподъёмного оборудования"

    - id: C6
      entity: "перемычки в акте о выполненных работах (синтетический документ)"
      attribute: наблюдение
      value: "25 перемычек уложено вместе с кладкой 66 м3; звено «тройка» 4+3+2; отдельной записи труда на перемычки нет"
      src: {doc: SRC.HIST_ACT, pdf_page: 1, section: "разд. 2-3", quote: 'Укладка сборных железобетонных перемычек'}
      basis: observation
      check: confirmed_partly
      mandatory: false
      note: "история подтверждает, что перемычки кладут в составе звена каменщиков, но состава именно для перемычек не даёт"

  derived:
    - {id: D1, formula: "при 40 проёмах: 40 x 0,45 и 40 x 0,15", value: "18,0 и 6,0 чел.-ч"}

  # Формула (ADR-0004, обозначения подтверждены научным руководителем 05.11.2026):
  #   H = q * n * k  (общая трудоёмкость, чел.-ч);  d ≈ H / m  (m = число работников, ОДНОВРЕМЕННО выполняющих работу);
  #   η = 1: совместная работа идеальна, потерь на координацию нет. Это упрощение семестра, а не утверждение,
  #   что работу можно ускорить пропорционально числу людей. Допустимость m (звено, делянка) должна быть обоснована отдельно.
  #   Пример научника: 100 м2 x 0,5 чел.-ч/м2 x k=1 = 50 чел.-ч; 5 человек -> около 10 ч.
  admissible_modes: []                       # полной допустимой команды собрать нельзя
  partial_mode:
    roles: [{role: "каменщик", grade: unknown, count: unknown}, {role: "рабочий со стропальным допуском", grade: unknown, count: unknown}, {role: "машинист башенного крана", grade: unknown, count: 1}]
    labor: {q: 40, n: "0,45 (+ строка 0,15, смысл не расшифрован)", H: 18.0, m: unknown, d: undefined}
    why: "H считается по норме, d нет: неизвестно m"

  not_found:
    - {id: U1, what: "состав звена или бригады, укладывающей перемычки", note: "ни в ТТК, ни в профстандарте, ни в истории нет"}
    - {id: U2, what: "численность и разряды рабочих", note: "ни один источник не называет число"}
    - {id: U3, what: "разряд машиниста башенного крана", note: "не указан"}
    - {id: U4, what: "значение второй строки нормы (0,15)", note: "в ТТК строки «а» и «б», смысл не раскрыт"}
    - {id: U5, what: "отдельная ГЭСН-норма на перемычки", note: "в проверенных таблицах 08-02-001 и 08-02-002 перемычек нет"}
    - {id: U6, what: "m: число одновременно работающих", note: "по формуле d = H / m длительность не считается, пока не известен состав; значение m не подбирается, чтобы получить число (η = 1 не отменяет требования обосновать m)"}

  traps:
    - {id: T1, wrong: "звено из 3 человек: каменщик 4 + 3 + 2 для перемычек", why: "это состав звена кладки из акта (синтетика), не перемычек"}
    - {id: T2, wrong: "монтажник-такелажник 2 разр. x2 (из ТК 3.01.01.03)", why: "состав бригады на 15 человек из карты наружных стен, не переносится"}
    - {id: T3, wrong: "0,15 как норма машиниста", why: "смысл строки не установлен"}
    - {id: T4, wrong: "каменщик 5 разряда", why: "нет в источниках; стандарт даёт уровень 2 для функции B/02.2"}

pass_criteria:
  must:
    - "норма 0,45 чел.-ч на проём с источником и пометкой о второй строке"
    - "требование стропального допуска с источником (ТТК п. 8.3, профстандарт стр. 4)"
    - "H = q·n·k считается по норме (18,0 чел.-ч при 40 проёмах), а длительность d названа неопределённой, потому что m неизвестно"
    - "U1-U3 и U6 названы неизвестными: состав, численность, разряд машиниста, m"
  must_not:
    - "придуманное звено или численность"
    - "значения из ловушек T1-T4"

open_for_expert:
  - "как трактовать две строки нормы ЕНиР §Е3-16 (рабочие и крановщик?)"
  - "считать ли нижней границей состава пару «каменщик + стропальщик»"
  - "можно ли оценивать d для перемычек по нижней границе «каменщик + стропальщик» (m = 2) или d оставлять неопределённой"
  - "условные значения: 40 проёмов, кран, каталог"

notes: >
  Главное в пакете: ответ «неизвестно» тоже ответ, и он должен быть частичным, а не пустым.
  Пакет проверяет, умеет ли система отдать подтверждённые части и честно оставить состав пустым.
