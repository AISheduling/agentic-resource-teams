# ПИЛОТНЫЙ ПАКЕТ PKG-03 (проверен по оригиналам PDF; ждёт проверки экспертом)
# Номера страниц = страницы PDF (первая страница файла = 1). Источники: docs/sources.yaml.

id: PKG-03
title: "Глухие перегородки 120 мм (0,5 кирпича): пять разных значений трудоёмкости"
status: checked_against_pdf
kind: conflict
why_this_kind: >
  Для одной работы пять источников дают пять разных норм на 1 м2: от 0,517 до 1,44 чел.-ч (разброс
  в 2,8 раза). Состав звена при этом согласован (каменщик 4 разр. + каменщик 2 разр.).
  Система не должна усреднять и не должна считать «историю» нормой.

input:
  work_description: >
    Кладка глухих перегородок толщиной 120 мм (0,5 кирпича) из лицевого керамического кирпича
    250x120x65 мм, расшивка швов с одной стороны, неармированные.
  volume: {value: 100.0, unit: "м2"}         # УСЛОВНОЕ значение (удобно: ГЭСН считает на 100 м2)
  conditions:
    floor_height_m: 3.0                      # УСЛОВНОЕ значение (до 4 м)
    season: null
    lifting: "башенный кран"                 # УСЛОВНОЕ значение
  masked_fields: [crew_composition, qualifications, labor_norm, equipment]
  resource_catalog:                          # УСЛОВНЫЙ каталог
    roles: ["каменщик 2 разр.", "каменщик 3 разр.", "каменщик 4 разр.", "такелажник 2 разр.", "машинист башенного крана"]
    equipment: ["кран башенный", "подмости шарнирно-панельные", "ящик для раствора"]
  variants:
    V1: "полное описание"
    V2: "перегородки 120 мм, 100 м2"
    V3: "бригада для кладки полукирпичных перегородок"

sources:
  - {id: SRC.GESN_2001, role: norm}
  - {id: SRC.GESN_2022, role: norm}
  - {id: SRC.LABOR_7353, role: labor_process_card}
  - {id: SRC.TTK_WALLS, role: example, use: "ЕНиР, но для перегородок из КАМНЕЙ"}
  - {id: SRC.HIST_JOURNAL, role: history_synthetic}

gold:
  claims:
    - id: C1
      entity: "кладка перегородок 120 мм из керамических камней, ЕНиР §Е3-12 №4, прим. 4"
      attribute: норма времени
      value: 0.517
      unit: "чел.-ч/м2"
      src: {doc: SRC.TTK_WALLS, pdf_page: 26, section: "табл. 6.1, п. 5", quote: 'перегородок толщиной 120мм'}
      basis: document
      check: conflict
      mandatory: false
      applicability: "в ТТК перегородки из керамических камней, не из кирпича; 0,47 x 1,1 = 0,517; единица м2 проверена по изображению"

    - id: C2
      entity: "норма 08-02-002-05, перегородки 0,5 кирпича неармированные, высота этажа до 4 м"
      attribute: затраты труда рабочих-строителей (ГЭСН-2001)
      value: 143.99
      unit: "чел.-ч/100 м2"
      src: {doc: SRC.GESN_2001, pdf_page: 10, section: "табл. 08-02-002, графа 08-02-002-05", quote: '143,99'}
      basis: document
      check: conflict
      mandatory: false
      note: "средний разряд 3; кран башенный 4,11 маш.-ч на 100 м2 (измеритель на стр. 9: 100 м2 перегородок за вычетом проемов)"

    - id: C3
      entity: "та же норма 08-02-002-05 (ГЭСН-2022)"
      attribute: затраты труда рабочих
      value: 121
      unit: "чел.-ч/100 м2"
      src: {doc: SRC.GESN_2022, pdf_page: 12, section: "табл. 08-02-002, графа 08-02-002-05", quote: 'Средний разряд работы 3,0 чел.-ч 121 92,5'}
      basis: document
      check: conflict
      mandatory: false
      note: "средний разряд 3,0; кран 4,11 маш.-ч; разница с изданием 2001 около 16 %"

    - id: C4
      entity: "кладка глухих перегородок 12,5 см в 0,5 кирпича (карта труда 6)"
      attribute: затраты труда на 1 м2
      value: 0.86
      unit: "чел.-ч/м2"
      src: {doc: SRC.LABOR_7353, pdf_page: 44, section: "карта 6, п. 1.2", quote: '9,3'}
      basis: document
      check: conflict
      mandatory: false
      note: "выработка 9,3 м2 на чел.-день: 8 / 0,86 = 9,3, сходится"

    - id: C5
      entity: "та же карта 6"
      attribute: состав исполнителей
      value: "каменщик 4 разр. x1 (К-1); каменщик 2 разр. x1 (К-2)"
      src: {doc: SRC.LABOR_7353, pdf_page: 44, section: "карта 6, п. 2.1", quote: 'Каменщик 4 разряда (К-1)'}
      basis: document
      check: confirmed
      mandatory: true
      why_mandatory: "карта прямо про эту работу (лицевой кирпич 250x120x65, расшивка с одной стороны)"

    - id: C6
      entity: "перегородки 120 мм, звенья А и Б (журнал)"
      attribute: фактический состав и выработка
      value: "звено А: К4+К2, 178 чел.-ч, 182,5 м2; звено Б: К3+К2, 82 чел.-ч, 70,5 м2; всего 260 чел.-ч на 253,0 м2"
      src: {doc: SRC.HIST_JOURNAL, pdf_page: 3, section: "разд. 4, сводка по звеньям и итого", quote: 'Звено А'}
      basis: observation
      check: conflict
      mandatory: false
      note: "история: не норматив. Расчёт 260 / 253,0 = 1,03 чел.-ч/м2"

    - id: C7
      entity: "допустимый состав звена для перегородок и стен"
      attribute: диапазон разряда старшего каменщика
      value: "каменщик 3-4 разр. + каменщик 2 разр."
      src: {doc: SRC.TTK_WALLS, pdf_page: 24, section: "п. 5.5, рис. 20", quote: 'К - каменщик 3 - 4 разряда'}
      basis: document
      check: confirmed_partly
      mandatory: false
      applicability: "рис. 20 про стену 1,5 кирпича из камней, не про перегородку 120 мм"

  derived:
    - {id: D1, formula: "по нормам на м2: ЕНиР 0,517; карта 0,86; журнал 1,03; ГЭСН-2022 1,21; ГЭСН-2001 1,4399", note: "максимум / минимум = 1,4399 / 0,517 = 2,79"}
    - {id: D2, formula: "средний разряд звена К4+К2 = (4+2)/2", value: 3.0, note: "совпадает с разрядом работы 3 / 3,0 в обоих изданиях ГЭСН; К3+К2 даёт 2,5 (не совпадает)"}
    - {id: D3, formula: "кран по журналу: 15,2 маш.-ч / 253,0 м2 x 100", value: 6.01, unit: "маш.-ч/100 м2", note: "ГЭСН даёт 4,11 в обоих изданиях"}

  # Формула (ADR-0004, обозначения подтверждены научным руководителем 05.11.2026):
  #   H = q * n * k  (общая трудоёмкость, чел.-ч);  d ≈ H / m  (m = число работников, ОДНОВРЕМЕННО выполняющих работу);
  #   η = 1: совместная работа идеальна, потерь на координацию нет. Это упрощение семестра, а не утверждение,
  #   что работу можно ускорить пропорционально числу людей. Допустимость m (звено, делянка) должна быть обоснована отдельно.
  #   Пример научника: 100 м2 x 0,5 чел.-ч/м2 x k=1 = 50 чел.-ч; 5 человек -> около 10 ч.
  admissible_modes:
    - mode_id: M1
      roles: [{role: каменщик, grade: 4, count: 1}, {role: каменщик, grade: 2, count: 1}]
      labor_variants:                        # q = 100 м2, k = 1,0, m = 2, η = 1; d = H / 2
        by_GESN_2001: {n_per_m2: 1.4399, H: 143.99, d_hours: 72.0}
        by_GESN_2022: {n_per_m2: 1.21,   H: 121.0,  d_hours: 60.5}
        by_card_7353: {n_per_m2: 0.86,   H: 86.0,   d_hours: 43.0}
        by_history:   {n_per_m2: 1.03,   H: 103.0,  d_hours: 51.5}
        by_ENiR_stone: {n_per_m2: 0.517, H: 51.7,   d_hours: 25.85}
      equipment: [башенный кран, подмости шарнирно-панельные, ящик для раствора 0,25 м3]
      supported_by: [C2, C3, C4, C5, C6]
      admissible: true
    - mode_id: M2
      roles: [{role: каменщик, grade: 3, count: 1}, {role: каменщик, grade: 2, count: 1}]
      labor_variants: "те же, что у M1"
      supported_by: [C6, C7]
      admissible: conditional
      why: "звено Б из журнала и диапазон 3-4 из ТТК; но средний разряд 2,5 ниже разряда работы 3,0"

  not_found:
    - {id: U1, what: "разряд и допуск машиниста башенного крана", note: "в картах и журнале не указан; в ГЭСН только часы"}
    - {id: U2, what: "численность такелажника или стропальщика", note: "в журнале и карте 6 отдельной роли нет"}
    - {id: U3, what: "значение ГЭСН-2022 для перегородок из камней (08-02-009-03)", note: "в пакете не извлечено; в ГЭСН-2001 08-02-009-03 равно 122,57 чел.-ч/100 м2, стр. 13"}
    - {id: U4, what: "какое из пяти значений принимать для планирования", note: "решение эксперта"}
    - {id: U5, what: "доказанность m = 2 для 100 м2 перегородок", note: "звено из двух человек есть в карте и журнале, но можно ли поставить больше людей или звеньев на 100 м2 и каков предел по делянке, источники не говорят; d = H/m при η = 1 это не проверяет"}

  traps:
    - {id: T1, wrong: "среднее норм (около 1,01 чел.-ч/м2)", why: "усреднение конфликта запрещено"}
    - {id: T2, wrong: "143,99 или 121 чел.-ч на м2 (без деления на 100)", why: "ГЭСН даёт на 100 м2"}
    - {id: T3, wrong: "0,47 чел.-ч/м2 (без коэффициента 1,1)", why: "в ТТК норма умножена на 1,1 (прим. 4)"}
    - {id: T4, wrong: "нормы 08-02-002-01...04 (армированные)", why: "перегородки по запросу неармированные: 08-02-002-05"}
    - {id: T5, wrong: "считать журнал нормативом", why: "это наблюдение (история), не норма"}

pass_criteria:
  must:
    - "звено 4+2 с источником (карта 7353, журнал) или допустимый диапазон 3-4 + 2 из ТТК"
    - "все значения трудоёмкости названы раздельно с типом источника (норматив, карта, ЕНиР, история)"
    - "единицы: ГЭСН на 100 м2, остальные на м2"
    - "для каждой нормы показаны H = q·n·k и d = H/m при m = 2 (от 25,85 до 72,0 ч), раздельно, без усреднения"
    - "U1-U5 неизвестны или за экспертом"
  must_not:
    - "усреднённое значение"
    - "значения из ловушек T1-T5"

open_for_expert:
  - "допустимо ли ЕНиР для камней (C1) сравнивать с нормами для кирпича"
  - "какое из значений использовать как основу режима (норматив, карта труда или факт)"
  - "условные значения: объём 100 м2, высота этажа 3 м, кран, каталог"
  - "можно ли принять m = 2 и допустимо ли увеличивать m для 100 м2 (η = 1 это не проверяет)"
  - "журнал синтетический: считать ли его приемлемой историей для обоснования"

notes: >
  Звено согласовано, расходятся нормы. Для оценки метода это хороший случай: «правильное поведение»
  состоит не в выборе числа, а в раздельном показе источников.
